# The zero trust baseline form. Block everything outside the workspace and pass only what is needed.
# Validate with airlock policy check --policy examples/policy/strict.toml.
#
# Since [defaults].exec is not allow, exec becomes a kernel whitelist. Only the programs
# and top-level commands written in the kind = "exec" allow rules below run; the kernel
# refuses everything else. If a program you need is missing, add that line. The point of
# this preset is that widening is easy, but the fact that you widened stays in the policy file.

version = 1
name = "strict"

[defaults]
file = "deny"
exec = "ask"
egress = "deny"
# Same as the default, but stated explicitly. A preset is a document that shows the spec to humans.
# Plaintext outbound cannot cross this floor even toward allowed hosts.
egress_plaintext = "deny"

# Workspace
[[rules]]
id = "workspace"
kind = "file"
path = "~/work/**"
action = "allow"

# Toolchain read: needed to read executables and libraries.
#
# It matters that mode carries no exec. Granting exec here would widen the
# whitelist to all of /usr, /bin, /System, and /Library, making virtually the
# whole system executable. Execution is opened only by the kind = "exec" rules below.
[[rules]]
id = "toolchain-read"
kind = "file"
path = ["/usr/**", "/bin/**", "/opt/homebrew/**", "/System/**", "/Library/**"]
mode = ["read", "metadata"]
action = "allow"

# Build caches: writing is needed
[[rules]]
id = "build-cache"
kind = "file"
path = ["~/.cargo/registry/**", "~/.cargo/git/**", "~/.rustup/**", "~/.npm/_cacache/**"]
action = "allow"

#
# Exec allow list
#
# Writing only a name in program opens just the path it resolves to on the current PATH.
# Writing a file with the same name into the workspace does not make it run.

# Shells
# Without a shell the agent cannot run a single command. macOS /bin/sh re-execs
# itself as /bin/bash through the dyld variant mechanism, so both are needed
# (docs/limitations.md 4.13).
[[rules]]
id = "exec-sh"
kind = "exec"
program = "sh"
action = "allow"

[[rules]]
id = "exec-bash"
kind = "exec"
program = "bash"
action = "allow"

[[rules]]
id = "exec-zsh"
kind = "exec"
program = "zsh"
action = "allow"

# Exec helpers
# env and xargs are conduits that exec other programs on one's behalf. Once opened,
# whatever launches through them is judged again by this list. which is for path lookup.
[[rules]]
id = "exec-env"
kind = "exec"
program = "env"
action = "allow"

[[rules]]
id = "exec-xargs"
kind = "exec"
program = "xargs"
action = "allow"

[[rules]]
id = "exec-which"
kind = "exec"
program = "which"
action = "allow"

