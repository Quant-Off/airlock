# macOS developer tool shims
#
# On macOS, /usr/bin/git, /usr/bin/make, /usr/bin/cc, and /usr/bin/python3 are not the
# real programs but shims that re-exec into /Library/Developer/CommandLineTools. With the
# name rules above alone, that re-exec is blocked in the kernel and the program never
# starts at all (the same nature as the /bin/sh dyld variant, docs/limitations.md 4.13).
#
# Opening only usr/bin is not enough. Entries inside it, like python3, are symbolic links
# pointing at the real files on the framework side, and the kernel judges by the resolved
# path. So we open the whole CommandLineTools tree in one piece.
#
# This rule also opens the other executables inside the developer tool tree. Even so, it
# is far narrower than opening all of /usr, /System, and /Library, and tools used for
# exfiltration such as curl, nc, ssh, and osascript remain outside. If you use Xcode.app,
# you must add /Applications/Xcode.app/Contents/Developer/** the same way. Linux has no
# such path, so this opens nothing there.
[[rules]]
id = "exec-macos-developer-tools"
kind = "exec"
program = "/Library/Developer/CommandLineTools/**"
action = "allow"

#
# Outbound
#
# Only actually enforced per host once the egress proxy layer is attached.
[[rules]]
id = "llm-api"
kind = "egress"
host = "api.foollm.com"
port = 443
action = "allow"

[[rules]]
id = "crates-io"
kind = "egress"
host = "*.crates.io"
port = 443
action = "allow"
