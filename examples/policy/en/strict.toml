# Toolchain
# Delete the lines for languages you do not use. A name absent from PATH shows
# up in the banner as a limitation, and the kernel refuses to execute that program.
[[rules]]
id = "exec-git"
kind = "exec"
program = "git"
action = "allow"

[[rules]]
id = "exec-cargo"
kind = "exec"
program = "cargo"
action = "allow"

[[rules]]
