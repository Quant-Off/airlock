# 제로 트러스트 기본형입니다. 작업 공간 밖은 전부 막고 필요한 것만 통과시킵니다.
# airlock policy check --policy examples/policy/strict.toml로 검증합니다.
#
# [defaults].exec 이 allow 가 아니므로 exec 은 커널 화이트리스트가 됩니다. 아래
# kind = "exec" allow 에 적힌 프로그램과 최상위 명령만 실행되고 나머지는 커널이
# 거부합니다. 필요한 프로그램이 빠져 있으면 그 줄을 추가하세요. 넓히기 쉬운 만큼
# 넓힌 사실이 정책 파일에 남는다는 것이 이 프리셋의 요지입니다.

version = 1
name = "strict"

[defaults]
file = "deny"
exec = "ask"
egress = "deny"
# 기본값과 같지만 명시합니다. 프리셋은 규격을 사람에게 보여 주는 문서입니다.
# 평문 아웃바운드는 허용된 호스트에 대해서도 이 바닥을 넘지 못합니다.
egress_plaintext = "deny"

# 작업 공간
[[rules]]
id = "workspace"
kind = "file"
path = "~/work/**"
action = "allow"

# 툴체인 읽기: 실행 파일과 라이브러리를 읽는 데 필요합니다.
#
# mode 에 exec 이 없는 것이 중요합니다. 여기에 exec 을 주면 화이트리스트가
# /usr, /bin, /System, /Library 전체로 넓어져 사실상 시스템 전체가 실행 가능해집니다.
# 실행 허용은 아래 kind = "exec" 규칙으로만 열립니다.
[[rules]]
id = "toolchain-read"
kind = "file"
path = ["/usr/**", "/bin/**", "/opt/homebrew/**", "/System/**", "/Library/**"]
mode = ["read", "metadata"]
action = "allow"

# 빌드 캐시: 쓰기가 필요
[[rules]]
id = "build-cache"
kind = "file"
path = ["~/.cargo/registry/**", "~/.cargo/git/**", "~/.rustup/**", "~/.npm/_cacache/**"]
action = "allow"

#
# 실행 허용 목록
#
# program 에 이름만 적으면 지금 PATH 에서 해소되는 경로만 열립니다. 작업 공간에
# 같은 이름의 파일을 써 넣어도 그것이 실행되지는 않습니다.

# 쉘
# 쉘이 없으면 에이전트가 명령 하나도 돌리지 못합니다. macOS 의 /bin/sh 는 dyld
# variant 기구로 자기를 /bin/bash 로 다시 exec 하므로 둘 다 필요합니다
# (docs/limitations.md 4.13).
[[rules]]
id = "exec-sh"
kind = "exec"
program = "sh"
action = "allow"

[[rules]]
id = "exec-bash"
kind = "exec"
program = "bash"
action = "allow"

[[rules]]
id = "exec-zsh"
kind = "exec"
program = "zsh"
action = "allow"

# 실행 보조
# env 와 xargs 는 다른 프로그램을 대신 exec 하는 통로입니다. 열면 그 뒤로 무엇이
# 뜨는지는 이 목록이 다시 판정합니다. which 는 경로 탐색용입니다.
[[rules]]
id = "exec-env"
kind = "exec"
program = "env"
action = "allow"

[[rules]]
id = "exec-xargs"
kind = "exec"
program = "xargs"
action = "allow"

[[rules]]
id = "exec-which"
kind = "exec"
program = "which"
action = "allow"

# 파일 조작
# 에이전트가 작업 공간을 읽고 고치는 데 쓰는 최소 집합입니다.
[[rules]]
id = "exec-ls"
kind = "exec"
program = "ls"
action = "allow"

[[rules]]
id = "exec-cat"
kind = "exec"
program = "cat"
action = "allow"

[[rules]]
id = "exec-cp"
kind = "exec"
program = "cp"
action = "allow"

[[rules]]
id = "exec-mv"
kind = "exec"
program = "mv"
action = "allow"

[[rules]]
id = "exec-rm"
kind = "exec"
program = "rm"
action = "allow"

[[rules]]
id = "exec-mkdir"
kind = "exec"
program = "mkdir"
action = "allow"

[[rules]]
id = "exec-ln"
kind = "exec"
program = "ln"
action = "allow"

[[rules]]
id = "exec-chmod"
kind = "exec"
program = "chmod"
action = "allow"

[[rules]]
id = "exec-touch"
kind = "exec"
program = "touch"
action = "allow"

[[rules]]
id = "exec-stat"
kind = "exec"
program = "stat"
action = "allow"

[[rules]]
id = "exec-find"
kind = "exec"
program = "find"
action = "allow"

# 텍스트 처리
# 코드 검색과 편집에 쓰입니다.
[[rules]]
id = "exec-grep"
kind = "exec"
program = "grep"
action = "allow"

[[rules]]
id = "exec-sed"
kind = "exec"
program = "sed"
action = "allow"

[[rules]]
id = "exec-awk"
kind = "exec"
program = "awk"
action = "allow"

[[rules]]
id = "exec-head"
kind = "exec"
program = "head"
action = "allow"

[[rules]]
id = "exec-tail"
kind = "exec"
program = "tail"
action = "allow"

[[rules]]
id = "exec-sort"
kind = "exec"
program = "sort"
action = "allow"

[[rules]]
id = "exec-uniq"
kind = "exec"
program = "uniq"
action = "allow"

[[rules]]
id = "exec-wc"
kind = "exec"
program = "wc"
action = "allow"

[[rules]]
id = "exec-cut"
kind = "exec"
program = "cut"
action = "allow"

[[rules]]
id = "exec-tr"
kind = "exec"
program = "tr"
action = "allow"

[[rules]]
id = "exec-diff"
kind = "exec"
program = "diff"
action = "allow"

[[rules]]
id = "exec-tee"
kind = "exec"
program = "tee"
action = "allow"

[[rules]]
id = "exec-basename"
kind = "exec"
program = "basename"
action = "allow"

[[rules]]
id = "exec-dirname"
kind = "exec"
program = "dirname"
action = "allow"

# 잡다한 것
# 스크립트가 흔히 부르는 것들입니다.
[[rules]]
id = "exec-echo"
kind = "exec"
program = "echo"
action = "allow"

[[rules]]
id = "exec-date"
kind = "exec"
program = "date"
action = "allow"

[[rules]]
id = "exec-sleep"
kind = "exec"
program = "sleep"
action = "allow"

[[rules]]
id = "exec-uname"
kind = "exec"
program = "uname"
action = "allow"

# 툴체인
# 쓰지 않는 언어의 줄은 지우세요. PATH 에 없는 이름은 배너에 한계로 나오며
# 커널은 그 프로그램의 실행을 거부합니다.
[[rules]]
id = "exec-git"
kind = "exec"
program = "git"
action = "allow"

[[rules]]
id = "exec-cargo"
kind = "exec"
program = "cargo"
action = "allow"

[[rules]]
id = "exec-rustc"
kind = "exec"
program = "rustc"
action = "allow"

[[rules]]
id = "exec-make"
kind = "exec"
program = "make"
action = "allow"

[[rules]]
id = "exec-cc"
kind = "exec"
program = "cc"
action = "allow"

[[rules]]
id = "exec-python3"
kind = "exec"
program = "python3"
action = "allow"

[[rules]]
id = "exec-node"
kind = "exec"
program = "node"
action = "allow"

[[rules]]
id = "exec-npm"
kind = "exec"
program = "npm"
action = "allow"

# macOS 개발자 도구 shim
#
# macOS 의 /usr/bin/git, /usr/bin/make, /usr/bin/cc, /usr/bin/python3 은 실제 프로그램이
# 아니라 /Library/Developer/CommandLineTools 아래로 다시 exec 하는 shim 입니다. 위의
# 이름 규칙만으로는 그 재실행이 커널에서 막혀 프로그램이 아예 뜨지 못합니다
# (/bin/sh 의 dyld variant 와 같은 성질, docs/limitations.md 4.13).
#
# usr/bin 만 열어서는 부족합니다. python3 처럼 그 안의 항목이 프레임워크 쪽 실제
# 파일을 가리키는 심볼릭 링크라, 커널은 해소된 경로로 판정하기 때문입니다. 그래서
# CommandLineTools 트리 하나를 통째로 엽니다.
#
# 이 규칙은 개발자 도구 트리 안의 다른 실행 파일도 함께 엽니다. 그래도 /usr 와
# /System 과 /Library 전체를 여는 것보다는 훨씬 좁고, curl 과 nc 와 ssh 와 osascript
# 처럼 반출에 쓰이는 도구는 여전히 밖에 있습니다. Xcode.app 을 쓴다면
# /Applications/Xcode.app/Contents/Developer/** 을 같은 방식으로 추가해야 합니다.
# Linux 에는 이 경로가 없으므로 아무것도 열지 않습니다.
[[rules]]
id = "exec-macos-developer-tools"
kind = "exec"
program = "/Library/Developer/CommandLineTools/**"
action = "allow"

#
# 아웃바운드
#
# egress 프록시 층이 붙어야 호스트 단위로 실제 강제됩니다.
[[rules]]
id = "llm-api"
kind = "egress"
host = "api.foollm.com"
port = 443
action = "allow"

[[rules]]
id = "crates-io"
kind = "egress"
host = "*.crates.io"
port = 443
action = "allow"
